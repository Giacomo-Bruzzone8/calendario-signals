<div class="timeline-container">

  <!-- Controlli -->
  <div class="controls">
    <button (click)="visibleCycle = 'day'">Luce</button>
    <button (click)="visibleCycle = 'night'">Buio</button>
  </div>

  <svg width="240" height="240" viewBox="0 0 200 200">

    <!-- CERCHIO PRINCIPALE -->
    <circle 
      cx="100" cy="100" r="90"
      [attr.stroke]="visibleCycle === 'day' ? '#FFC107' : '#3F51B5'"
      stroke-width="1.5"
      fill="none"
    />


    <!-- TACCHETTE LUCE -->
    <g *ngIf="visibleCycle === 'day'">
      @for (t of getDayTicks(); track t.angle) {

        <path 
          [attr.d]="buildTickPath(t.angle)"
          stroke="#FFC107"
          stroke-width="2"
        />

        <text 
          [attr.x]="polarToCartesian(100, 100, 72, t.angle).x"
          [attr.y]="polarToCartesian(100, 100, 72, t.angle).y"
          text-anchor="middle"
          alignment-baseline="middle"
          class="hour-label"
        >
          {{ t.hour }}
        </text>
      }
    </g>

    <!-- TACCHETTE BUIO -->
    <g *ngIf="visibleCycle === 'night'">
      @for (t of getNightTicks(); track t.angle) {

        <path 
          [attr.d]="buildTickPath(t.angle)"
          stroke="#3F51B5"
          stroke-width="2"
        />

        <text 
          [attr.x]="polarToCartesian(100, 100, 72, t.angle).x"
          [attr.y]="polarToCartesian(100, 100, 72, t.angle).y"
          text-anchor="middle"
          alignment-baseline="middle"
          class="hour-label"
        >
          {{ t.hour }}
        </text>
      }
    </g>

    <!-- ARCHI DELLE ATTIVITÀ (solo del ciclo selezionato) -->
    <g>
      @for (arc of archiLogici; track arc.startAngle) {
        @if (arc.cycle === visibleCycle) {
          <path 
            [attr.d]="disegnaArcoPortion(arc)"
            [attr.stroke]="getColorForEvent(arc.originalEvent)"
            stroke-width="7"
            fill="none"
            stroke-linecap="round"
          />
        }
      }
    </g>

    <!-- ICONA CENTRALE (SOLE / LUNA) -->
    <g>
      @if (visibleCycle === 'day') {
        <!-- Sole minimal -->
        <circle cx="100" cy="100" r="12" fill="#FFC107" />
        <circle cx="100" cy="100" r="6" fill="#FFF8E1" />
      }
      @else {
        <!-- Luna minimal -->
        <path 
          d="M100 88
             A12 12 0 1 0 100 112
             A8 8 0 1 1 100 88"
          fill="#3F51B5"
        />
      }
    </g>

  </svg>

</div>

<pre>{{ archiLogici | json }}</pre>
