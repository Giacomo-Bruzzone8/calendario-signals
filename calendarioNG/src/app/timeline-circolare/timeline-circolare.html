<div class="timeline-container">

  <div class="controls">
    <button (click)="modalita = 'giorno'">Giorno</button>
    <button (click)="modalita = 'notte'">Notte</button>
  </div>

  <svg width="240" height="240" viewBox="0 0 200 200">

    <!-- Cerchio base -->
    <circle 
      cx="100" cy="100" r="90"
      stroke="#333"
      stroke-width="1.5"
      fill="none"
    />

    <!-- TACCHETTE + LABEL -->
    <g>
      @for (t of generaTacche(); track t.angolo) {

        <!-- Tacca -->
        <path 
          [attr.d]="generaTacca(t.angolo)"
          [attr.stroke]="t.colore"
          stroke-width="2"
        />

        <!-- Label ora -->
        <text 
          [attr.x]="polarToCartesian(100, 100, 72, t.angolo).x"
          [attr.y]="polarToCartesian(100, 100, 72, t.angolo).y"
          text-anchor="middle"
          alignment-baseline="middle"
          class="hour-label"
        >
          {{ t.ora }}
        </text>
      }
    </g>

    <!-- ARCHI DELLE ATTIVITÀ -->
    <g>
      @for (ev of eventi; track ev) {
        @if (calcolaArcoAttivita(ev) !== '') {
          <path 
            [attr.d]="calcolaArcoAttivita(ev)"
            [attr.stroke]="getColore(ev)"
            stroke-width="7"
            fill="none"
            stroke-linecap="round"
            class="activity-arc"
          />
        }
      }
    </g>

  </svg>

</div>
