<div class="timeline-container">

  <!-- Pulsante per cambiare modalità -->
  <button (click)="modalita = modalita === 'giorno' ? 'notte' : 'giorno'">
    Passa a {{ modalita === 'giorno' ? 'notte' : 'giorno' }}
  </button>

  <!-- SVG principale -->
  <svg width="200" height="200" viewBox="0 0 200 200">

    <!-- Cerchio di sfondo -->
    <circle cx="100" cy="100" r="90" fill="#111" stroke="#333" stroke-width="2" />

    <!-- Tacche delle ore -->
    <g stroke="white" stroke-width="2">

      @if (modalita === 'giorno') {
        @for (t of taccheGiorno; track t.ora) {
          <path [attr.d]="generaTacca(t.angolo)" [attr.stroke]="t.colore" />
        }
      } @else {
        @for (t of taccheNotte; track t.ora) {
          <path [attr.d]="generaTacca(t.angolo)" [attr.stroke]="t.colore" />
        }
      }

    </g>

    <!-- Archi delle attività -->
    <g stroke-width="8" fill="none">

      @for (a of eventi; track a.start) {
        <path
          [attr.d]="calcolaArcoAttivita(a)"
          [attr.stroke]="getColore(a)"
        />
      }

    </g>

  </svg>

</div>
